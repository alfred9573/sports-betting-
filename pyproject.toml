[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betbot"
version = "0.1.0"
description = "Bot de analisis de apuestas deportivas basado en valor esperado (EV)"
requires-python = ">=3.11"
# El nucleo de modelado corre en stdlib puro, a proposito. La unica dependencia
# es el bundle de certificados: la verificacion TLS tiene que funcionar nada mas
# instalar, y el Python de macOS no trae certificados utilizables por defecto.
dependencies = ["certifi>=2024.2.2"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
data = ["pandas>=2.0", "requests>=2.31"]   # solo para ingesta/backtesting historico

[project.scripts]
betbot = "betbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
